# ── JobRadar configuration ────────────────────────────────────────────
# Edit this file, then restart the server (or wait for the next sweep).
#
# The sweep runs every `term` below against every `location`, on every
# enabled site. Keep an eye on volume: terms × locations × sites × results
# is what the boards see each cycle, and LinkedIn/Glassdoor block bursts.

# ── What to search for ───────────────────────────────────────────────
# Boards match loosely, so a handful of well-chosen phrases covers
# Analyst → VP without listing every variant.
# Categories group the searches and tag every stored role by title, so each
# user can pick the categories they care about (header user switcher →
# preferences). A role can belong to several. Sweep order = order below;
# results are written after each term, so put what matters most first.
categories:
  hr:
    label: "Human Resources"
    terms:
      - "human resources manager"
      - "hr director"
      - "hr business partner"
      - "hris manager"
      - "people analytics"
    title_keywords: ["human resources", "hr", "hris", "hrbp", "people", "talent", "workforce", "recruit", "payroll", "benefits", "compensation"]
  analytics:
    label: "Analytics, BI & Data Science"
    terms:
      - "data analytics manager"
      - "data analyst"
      - "business intelligence"
      - "data science manager"
    title_keywords: ["analytics", "analyst", "business intelligence", "bi", "data science", "data scientist", "insights", "reporting"]
  governance:
    label: "Data Governance & Management"
    terms:
      - "data quality"
      - "data retention"
      - "data catalog implementation"
      - "data governance manager"
      - "senior manager data governance"
      - "director data governance"
      - "head of data governance"
      - "vp data governance"
      - "data management director"
      - "head of data"
      - "director metadata management"
      - "information governance director"
      - "records management director"
    title_keywords: ["data governance", "governance", "data management", "metadata", "data quality", "data catalog", "records", "retention", "information governance", "information management", "privacy", "compliance", "master data", "data steward", "head of data", "data strategy", "data office"]
  # How international organizations, development agencies and their
  # contractors title their data roles (M&E, statistics, information
  # management). These terms add 3 × locations searches per sweep.
  development:
    label: "M&E, Statistics & Development Data"
    terms:
      - "monitoring and evaluation"
      - "information management officer"
      - "statistician"
    title_keywords: ["monitoring", "evaluation", "m&e", "mel", "meal", "statistic", "statistics", "statistician", "statistical", "economist", "knowledge management", "results measurement", "programme data", "program data", "data officer", "data specialist", "data for development"]

# Extra terms outside any category (tagged "general"):
terms: []

# ── Where ────────────────────────────────────────────────────────────
# `remote: true` asks each board for remote-only listings in that country.
# `country` drives Indeed/Glassdoor's regional site (USA, Canada, United Arab
# Emirates, UK, … — any jobspy country name).
# 25 terms × 4 locations + 2 extras = 102 searches per sweep.
locations:
  - { name: "United States", country: "USA", remote: true }
  - { name: "United States", country: "USA" }
  - { name: "Canada",        country: "Canada" }
  - { name: "United Arab Emirates", country: "United Arab Emirates" }
  # - { name: "Canada",      country: "Canada", remote: true }
  # - { name: "London, United Kingdom", country: "UK" }

# Extra one-off (term, location) pairs, e.g. to keep a local search alive:
searches:
  - { term: "data governance", location: "Wilmington, DE", country: "USA" }
  - { term: "data governance", location: "Philadelphia, PA", country: "USA" }

# Sites: indeed, linkedin, glassdoor, zip_recruiter, google
# Google Jobs aggregates Dice, Lever, Greenhouse, Workday postings.
sites:
  - indeed
  - linkedin
  - glassdoor
  - zip_recruiter
  - google

results_per_site: 15          # per search, per site
hours_old: 48                 # only pull postings from the last N hours
refresh_minutes: 90           # 68 searches with LinkedIn page fetches take ~40 min

# LinkedIn only hands over salary, seniority and description when we open each
# job page (one extra request per job). Needed for the Easy Apply + salary
# columns; set to false if LinkedIn starts returning 429s.
linkedin_fetch_description: true
# Second, card-only LinkedIn pass with its "Easy Apply" filter on, so the
# dashboard can flag which LinkedIn roles apply in one click.
linkedin_easy_apply_pass: true

# ── Post-scrape filters (applied before a job is stored) ─────────────
# Title keyword lists match whole words ("hr" won't match "three"; "vp" won't
# match "svp", so list those separately).
# Title must contain at least one of these (keeps the list at analyst+ level).
# International organizations rarely say "manager": their professional grades
# are Officer / Specialist / Adviser / Economist / Statistician / Consultant.
title_keywords:
  - "manager"
  - "director"
  - "vp"
  - "svp"
  - "evp"
  - "avp"
  - "vice president"
  - "head"
  - "chief"
  - "lead"
  - "principal"
  - "analyst"
  - "scientist"
  - "business partner"
  - "officer"
  - "specialist"
  - "consultant"
  - "advisor"
  - "adviser"
  - "economist"
  - "statistician"
# Title must ALSO contain one of these (keeps it on-topic; boards return
# plenty of "Director, Marketing" for a "director data governance" query).
# Every category's title_keywords are added to this list automatically, so
# only list extras here.
title_must_include:
  - "data"
  - "information"
# Title OR description must mention one of these (empty = no check).
include_keywords: []
# Drop if the title contains any of these.
exclude_title_keywords:
  - "intern"
  - "junior"
  - "entry level"
  - "assistant manager"
  - "associate manager"
  - "coordinator"
  - "account manager"
  - "sales manager"
  - "store manager"
  - "nurse"
  - "clinical"
# Drop if the title OR description contains any of these.
exclude_keywords: []
# Only keep roles whose inferred seniority is in this list (empty = keep all).
# Buckets: C-level, VP, Head, Director, Senior Manager, Manager, Lead, Other
levels: []
# Countries a role's location can resolve to (code → label shown in the
# Country filter). Built in: US, CA, AE, GB, IE, DE, NL, CH, FR, SG, AU, IL,
# SA, QA — the UAE and the hubs whose employers routinely hire remote talent
# in North America. Anywhere else resolves to "Other".
country_labels:
  US: "United States"
  CA: "Canada"
  AE: "United Arab Emirates"
  GB: "United Kingdom"
  IE: "Ireland"
  DE: "Germany"
  NL: "Netherlands"
  CH: "Switzerland"
  FR: "France"
  SG: "Singapore"
  AU: "Australia"
  IL: "Israel"
  SA: "Saudi Arabia"
  QA: "Qatar"
# Keep only roles in these countries (and roles whose location gives no
# country, e.g. "Remote"). LinkedIn "remote" searches and the international
# organizations return roles worldwide otherwise; "Other" is always dropped.
# Trim this list to tighten; the Country filter in the sidebar follows it.
countries: ["US", "CA", "AE", "GB", "IE", "DE", "NL", "CH", "FR", "SG", "AU", "IL", "SA", "QA"]
min_salary: 0                 # annual USD; 0 disables. Jobs without a salary are kept.
remote_only: false

