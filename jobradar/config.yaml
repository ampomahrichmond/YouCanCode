# ── Organizations catalogue ──────────────────────────────────────────
# Career sites JobRadar checks directly every sweep, each with its sector.
# `url` is any page on the organization's careers site (Workday, Oracle Cloud,
# SuccessFactors, Cornerstone, Taleo, UN Careers, Greenhouse, Lever…); or give
# `provider` + `slug` explicitly. Entries without a site still teach the
# sector classifier the name (and `aliases`) so roles found on Indeed/LinkedIn
# are tagged. Every site listed with a URL was verified to answer on 2026-10-01.
organizations:
  # international financial institutions & UN system
  - { name: "International Monetary Fund", aliases: ["IMF"], sector: international, url: "https://imf.wd5.myworkdayjobs.com/IMF" }
  - { name: "World Bank Group", aliases: ["World Bank", "IFC", "International Finance Corporation", "MIGA"], sector: international, provider: cornerstone, slug: "worldbankgroup/1" }
  - { name: "Inter-American Development Bank", aliases: ["IDB", "IADB", "IDB Invest", "BID"], sector: international, provider: successfactors, slug: "jobs.iadb.org" }
  - { name: "United Nations Secretariat", aliases: ["United Nations", "UN Secretariat", "UN"], sector: international, provider: uncareers, slug: "careers.un.org" }
  - { name: "United Nations Development Programme", aliases: ["UNDP"], sector: international, provider: oracle, slug: "estm.fa.em2.oraclecloud.com/CX_1" }
