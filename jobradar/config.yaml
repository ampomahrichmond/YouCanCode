# ReliefWeb (UN agencies, NGOs and development contractors in one feed) needs a
# registered application name: request one at
# https://apidoc.reliefweb.int/parameters#appname, then set it here (or
# JOBRADAR_RELIEFWEB_APPNAME in .env). Empty = source off.
reliefweb:
  appname: ""

# ── Employer career sites (Tier 1) ───────────────────────────────────
# Companies' own career sites (Greenhouse, Lever, Ashby, SmartRecruiters,
# Workable, BambooHR, Workday, Oracle Cloud, SuccessFactors, Cornerstone,
# Taleo, UN Careers) have public feeds and never block. Boards are discovered
# automatically from the "apply at employer" links the big boards return,
# seeded from `organizations` above, and can be added by pasting any careers
# URL on the Companies tab or listing them here. They are checked first in
# every sweep.
ats:
  enabled: true
  auto_discover: true
  resolve_per_sweep: 25      # grnh.se / workable short links resolved per sweep
  max_new_per_board: 12      # new postings whose description is fetched per board per sweep
  max_age_days: 21           # skip postings older than this (where the site gives a date)
  workers: 6                 # boards checked concurrently
  # Workday, Oracle, SuccessFactors, Cornerstone, Taleo and ReliefWeb sites are
  # huge, so they are searched by keyword rather than listed (one request per
  # term per site):
  search_terms: ["data governance", "data management", "data quality", "data analytics", "human resources",
                 "monitoring and evaluation", "information management", "statistics", "data strategy"]
  boards: []                 # e.g. - "https://boards.greenhouse.io/acme"   or   - { provider: lever, slug: acme, sector: tech }

# ── Resume matching, pipeline, digest, LLM ───────────────────────────
# Roles not returned by the boards for this many completed sweeps are flagged
# "likely filled" and can be archived from the Insights tab.
stale_after_sweeps: 3

# Daily digest (Markdown file in ./digests, optional email). Runs at `time`
# in `timezone`. min_match applies only once a resume is uploaded.
digest:
  enabled: true
  time: "08:00"
  timezone: "America/New_York"
  hours: 24            # look-back window for "new" roles
  min_match: 60        # only roles scoring at least this
  max_jobs: 25
  # email:             # uncomment to email it; password via env var
  #   smtp_host: "smtp.gmail.com"
  #   smtp_port: 587
  #   user: "you@gmail.com"
  #   password_env: "JOBRADAR_SMTP_PASSWORD"
  #   to: "you@gmail.com"

# Optional Claude layer for "fit summary" and "cover letter" buttons. Needs
# ANTHROPIC_API_KEY in the environment (or `ant auth login`). Scoring itself
# is local and never sends the resume anywhere.
llm_model: "claude-opus-5"

# ── Proxies ──────────────────────────────────────────────────────────
# Glassdoor and ZipRecruiter sit behind Cloudflare and return 403 to direct
# requests; a rotating residential proxy is the only way through. Entries are
# "user:pass@host:port" or "host:port". Keep credentials out of this file:
#   easiest: create proxies.txt next to this file, one proxy per line — it is
#            re-read at every sweep, no restart needed;
#   or:      $env:JOBRADAR_PROXIES = "user:pass@gate.example.com:7777" before
#            starting the server.
proxies: []
proxies_file: "proxies.txt"
proxies_env: "JOBRADAR_PROXIES"
# Only these boards go through the proxy (saves paid bandwidth). Empty = all.
# Google serves this client a bot-check interstitial instead of results, so it
# is routed via proxy too; Indeed and LinkedIn work fine direct.
proxy_sites: ["glassdoor", "zip_recruiter", "google"]
